name: Build L40 v0.28 Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.l40.v028'
      - 'benchmark/requirements-direct.txt'
      - 'app/**'
      - '.github/workflows/docker-l40-v028.yml'

env:
  REGISTRY: docker.io
  OWNER: yorkane
  IMAGE: qwen3-asr

jobs:
  build-l40-v028:
    runs-on: ubuntu-latest
    environment: Docker
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo docker image prune -af || true
          echo "=== After cleanup ==="
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push v0.28 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.l40.v028
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:0.28

