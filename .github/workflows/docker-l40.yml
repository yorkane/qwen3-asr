name: Build L40 Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.l40'
      - 'app/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docker-l40.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: qwenasr
  TAG: l40

jobs:
  build-l40:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo docker image prune -af || true
          echo "=== After cleanup ==="
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push L40 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.l40
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}-${{ github.sha }}
          # NOTE: no GHA cache — model layers (~8GB) exceed gha cache limits;
          # the image is fully self-contained (models baked in), so cold build is
          # acceptable. Re-builds reuse Docker layer cache on the runner.

      - name: Cleanup old untagged images
        if: always()
        run: docker image prune -af || true
